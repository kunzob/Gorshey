<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder hero: original layered night scene. Replace this one <img> slot with a real illustration later. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070910"/>
      <stop offset="0.55" stop-color="#11131c"/>
      <stop offset="0.8" stop-color="#2a1d22"/>
      <stop offset="1" stop-color="#3a2629"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2ede4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f2ede4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="palace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e0d2"/>
      <stop offset="1" stop-color="#b9ada0"/>
    </linearGradient>
    <!-- grain lives in public/grain/grain.png -->
  </defs>

  <rect width="800" height="1200" fill="url(#sky)"/>
  <circle cx="610" cy="250" r="150" fill="url(#moon)"/>
  <circle cx="610" cy="250" r="44" fill="#ece5d6" opacity="0.85"/>

  <!-- stars: fixed positions, no randomness at runtime -->
  <g fill="#f2ede4">
    <circle cx="90" cy="120" r="1.4" opacity="0.8"/><circle cx="210" cy="60" r="1" opacity="0.6"/>
    <circle cx="330" cy="150" r="1.6" opacity="0.9"/><circle cx="470" cy="80" r="1.1" opacity="0.7"/>
    <circle cx="700" cy="110" r="1.5" opacity="0.8"/><circle cx="150" cy="300" r="1" opacity="0.5"/>
    <circle cx="260" cy="360" r="1.2" opacity="0.6"/><circle cx="540" cy="380" r="1" opacity="0.5"/>
    <circle cx="740" cy="420" r="1.3" opacity="0.7"/><circle cx="60" cy="470" r="1" opacity="0.5"/>
  </g>

  <!-- distant ridge -->
  <path d="M0 760 L120 700 L230 735 L360 672 L480 730 L600 690 L720 745 L800 712 L800 1200 L0 1200 Z" fill="#171a24"/>

  <!-- Potala-style palace: stepped white-wash mass with a maroon band and windows -->
  <g>
    <rect x="250" y="560" width="300" height="200" fill="url(#palace)"/>
    <rect x="290" y="500" width="220" height="70" fill="url(#palace)"/>
    <rect x="330" y="455" width="140" height="50" fill="url(#palace)"/>
    <rect x="365" y="415" width="70" height="42" fill="#d9d0bf"/>
    <rect x="250" y="700" width="300" height="14" fill="#8a7370"/>
    <rect x="290" y="570" width="220" height="10" fill="#8a7370" opacity="0.8"/>
    <g fill="#2a2320">
      <rect x="275" y="600" width="12" height="18"/><rect x="310" y="600" width="12" height="18"/>
      <rect x="345" y="600" width="12" height="18"/><rect x="380" y="600" width="12" height="18"/>
      <rect x="415" y="600" width="12" height="18"/><rect x="450" y="600" width="12" height="18"/>
      <rect x="485" y="600" width="12" height="18"/><rect x="520" y="600" width="12" height="18"/>
      <rect x="275" y="640" width="12" height="18"/><rect x="310" y="640" width="12" height="18"/>
      <rect x="345" y="640" width="12" height="18"/><rect x="380" y="640" width="12" height="18"/>
      <rect x="415" y="640" width="12" height="18"/><rect x="450" y="640" width="12" height="18"/>
      <rect x="485" y="640" width="12" height="18"/><rect x="520" y="640" width="12" height="18"/>
      <rect x="380" y="520" width="18" height="24"/><rect x="330" y="470" width="10" height="16"/>
      <rect x="450" y="470" width="10" height="16"/>
    </g>
    <rect x="200" y="700" width="400" height="500" fill="#0e1017"/>
  </g>

  <!-- prayer flags on lines: five colours, original placement -->
  <g stroke="#2a2320" stroke-width="1.2" fill="none">
    <path d="M150 640 Q 230 600 300 640"/>
    <path d="M500 640 Q 580 600 650 640"/>
  </g>
  <g>
    <rect x="170" y="630" width="14" height="22" fill="#2f5d8c"/>
    <rect x="190" y="622" width="14" height="22" fill="#f2ede4"/>
    <rect x="210" y="616" width="14" height="22" fill="#a33b3b"/>
    <rect x="230" y="616" width="14" height="22" fill="#3d7a4f"/>
    <rect x="250" y="622" width="14" height="22" fill="#c9a24a"/>
    <rect x="520" y="634" width="14" height="22" fill="#2f5d8c"/>
    <rect x="540" y="626" width="14" height="22" fill="#f2ede4"/>
    <rect x="560" y="620" width="14" height="22" fill="#a33b3b"/>
    <rect x="580" y="620" width="14" height="22" fill="#3d7a4f"/>
    <rect x="600" y="626" width="14" height="22" fill="#c9a24a"/>
  </g>

  <!-- foreground ground -->
  <rect x="0" y="930" width="800" height="270" fill="#07080c"/>
</svg>
