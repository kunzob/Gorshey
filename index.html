<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gorshey" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <title>Gorshey</title>
    <meta name="description" content="Gorshey is a synchronized online radio for Tibetan music, where every listener hears the same song at the same moment." />
    <link rel="preload" href="/fonts/NotoSerifTibetan-tibetan-subset.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div class="hero"><img id="hero" src="/hero/hero-potala.svg" alt="" /></div>
    <div class="scrim"></div>
    <div class="grain" aria-hidden="true"></div>

    <main class="player">
      <header class="top">
        <p class="badge mono"><span id="dot" class="dot" aria-hidden="true"></span><span id="badge">—</span></p>
        <time id="clock" class="clock mono">—</time>
        <button id="locale" class="touch toggle" type="button">—</button>
      </header>

      <h1 id="station" class="station">—</h1>

      <div id="halo" class="halo">
        <svg class="ring" aria-hidden="true" viewBox="0 0 100 100">
          <circle class="ring-track" cx="50" cy="50" r="45"></circle>
          <circle id="ring-fill" class="ring-fill" cx="50" cy="50" r="45"></circle>
        </svg>
        <img id="artwork" class="artwork" alt="" width="512" height="512" decoding="async" hidden />
      </div>

      <section id="strip" class="strip glass">
        <div class="text">
          <p id="eyebrow" class="eyebrow mono">—</p>
          <p id="title" class="title" lang="bo">—</p>
          <p id="subtitle" class="subtitle">—</p>
          <p id="artist" class="artist">—</p>
          <p id="position" class="position"></p>
        </div>
        <div class="controls">
          <button id="play" class="play" type="button">—</button>
        </div>
      </section>

      <p id="nextup" class="nextup">—</p>
      <p id="status" class="status" aria-live="polite"></p>
      <button id="update" class="update touch" type="button" aria-live="polite" hidden></button>
      <footer id="footer" class="footer mono caps"></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
